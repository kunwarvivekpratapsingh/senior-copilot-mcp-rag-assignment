server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames make these safe to cache indefinitely; index.html is
    # deliberately excluded so a new deploy is picked up on the next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
